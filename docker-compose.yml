services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: forge
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - forge-postgres-data:/var/lib/postgresql/data

volumes:
  forge-postgres-data:
