[project]
name = "forge-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic-settings==2.10.1"
]

[dependency-groups]
dev = [
  "mypy==1.17.1",
  "ruff==0.12.9"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["forge_worker"]
