[project]
name = "forge-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "cryptography==50.0.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "langchain==1.3.18",
  "langgraph==1.2.11",
  "opentelemetry-exporter-otlp-proto-http==1.44.0",
  "opentelemetry-sdk==1.44.0",
  "psycopg[binary]==3.2.9",
  "pydantic-settings==2.10.1",
  "pyjwt==2.13.0",
  "python-multipart==0.0.32",
  "redis==5.2.1",
  "starlette==1.6.0",
  "uvicorn[standard]==0.35.0"
]

[dependency-groups]
dev = [
  "mypy==1.17.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.12.9"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "security: adversarial and security boundary tests"
]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["forge_api"]

[[tool.mypy.overrides]]
module = ["redis", "redis.exceptions"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["langchain", "langchain.*", "langchain_core", "langchain_core.*", "langsmith", "langsmith.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["opentelemetry", "opentelemetry.*"]
ignore_missing_imports = true
