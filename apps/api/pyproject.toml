[project]
name = "forge-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "cryptography==45.0.6",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "psycopg[binary]==3.2.9",
  "pydantic-settings==2.10.1",
  "pyjwt==2.10.1",
  "python-multipart==0.0.20",
  "redis==5.2.1",
  "uvicorn[standard]==0.35.0"
]

[dependency-groups]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.9"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "security: adversarial and security boundary tests"
]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["forge_api"]
