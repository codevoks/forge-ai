name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: forge
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U forge -d forge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      FORGE_DATABASE_URL: postgresql://forge_runtime:forge_runtime@localhost:55432/forge
      FORGE_MIGRATION_DATABASE_URL: postgresql://forge:forge@localhost:55432/forge
      FORGE_EXTERNAL_INTEGRATIONS: disabled
      FORGE_OIDC_ISSUER: http://forge.local/oidc
      FORGE_OIDC_AUDIENCE: forge-local
      FORGE_OIDC_JWKS_PATH: local/jwks.json
      NEXT_PUBLIC_FORGE_API_BASE_URL: http://127.0.0.1:8000

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.13.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations and seed local CI database
        run: |
          pnpm db:migrate
          pnpm db:seed

      - name: Generate API contracts
        run: pnpm generate:types

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Security and adversarial tests
        run: pnpm test:security
